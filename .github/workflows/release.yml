name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node scripts/gen-spec.mjs --check
      - run: npm run spec:check
      - run: npm run docs:check
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f "docs/releases/${TAG}.md" ]; then
            gh release create "$TAG" \
              --title "OPC-玄机 ${TAG}" \
              --notes-file "docs/releases/${TAG}.md" \
              --verify-tag
          else
            gh release create "$TAG" \
              --title "OPC-玄机 ${TAG}" \
              --generate-notes \
              --verify-tag
          fi
