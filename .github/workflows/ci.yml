name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit / typecheck / gates (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.9", "24", "26"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node scripts/gen-spec.mjs --check
      - run: npm run spec:check
      - run: npm run docs:check

  integration:
    name: Integration (PostgreSQL 17 + pgvector)
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: opc
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: opc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opc -d opc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OPC_PG_DSN: postgresql://opc@127.0.0.1:5432/opc
      OPC_TEST_DSN: postgresql://opc@127.0.0.1:5432/opc_test
      OPC_TIMEZONE: Asia/Shanghai
      OPC_SCHEMA_VERSION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9"
          cache: npm
      - run: npm ci
      - name: Prepare databases
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h 127.0.0.1 -U opc -d opc_test -v ON_ERROR_STOP=1 -c "CREATE DATABASE opc;"
          for db in opc opc_test; do
            psql -h 127.0.0.1 -U opc -d "$db" -v ON_ERROR_STOP=1 \
              -c "CREATE EXTENSION IF NOT EXISTS vector;" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;" \
              -c "CREATE EXTENSION IF NOT EXISTS unaccent;"
          done
      - run: npm run migrate
      - run: npm run migrate:test
      - run: npm test
