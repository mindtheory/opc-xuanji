name: Bug report
description: Report a reproducible problem in OPC-玄机
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include credentials, `.env` contents, real customer data, or sensitive logs.
        For security vulnerabilities, use the Security tab instead of a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error codes/messages if available.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: v24.9.0
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DSH version
      placeholder: 0.2.1
  - type: input
    id: postgres
    attributes:
      label: PostgreSQL / pgvector
      placeholder: PostgreSQL 17.11 / pgvector 0.8.0
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - HTTP API
        - DSH tool
        - Web presentation layer
        - Employee plugin/package
        - Workflow/Verifier
        - Audit/security
        - Scheduler
        - Database/migration
        - Documentation/spec
        - CI/release
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets and sensitive data.
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I removed credentials, tokens, and real customer data from this report.
          required: true
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to the Security tab).
          required: true
