package: OPC-玄机 · 一人公司中枢
baselineTag: v2.11-20261106

usecases:
  - id: UC-001
    title: 视图级授权查询共享数据
    requirement: REQ-VIEW-001
    actors:
      - 员工插件
      - 中枢
    goal: 员工按注册时声明的视图查询聚合数据，未授权视图一律拒绝并写审计
    entities:
      - ViewGrant
      - EmployeePlugin
      - AuditLog
    api:
      - queryView
    tests:
      - TC-VIEW-001
    preconditions: 员工插件已注册且 required_views 覆盖目标视图
    steps:
      - 员工以 pluginId + viewId 发起查询
      - 中枢从 ref.view_grant 校验授权
      - 授权通过则执行参数化视图 SQL 并只返回聚合与索引字段
      - 无论通过或拒绝，写 opc_hub.audit.record 一条视图访问记录

  - id: UC-002
    title: 一次性令牌签发与消费
    requirement: REQ-TOKEN-001
    actors:
      - 中枢
      - 员工插件
      - 老板
    goal: 跨域读取敏感字段时，仅凭单次令牌访问单字段范围，日志不落敏感值
    entities:
      - Token
      - CustomerSensitive
      - AuditLog
    api:
      - issueToken
      - consumeToken
    tests:
      - TC-TOKEN-001
      - TC-TOKEN-002
    preconditions: 发起任务属于中枢已派工任务，字段范围已声明
    steps:
      - 中枢签发令牌，绑定 task_id / plugin_id / field_scope / expires_at 不超过 5 分钟
      - 员工携令牌消费一次
      - 消费成功返回授权字段值；重复消费或过期返回 409 并写审计
      - 审计只记录 token_id、task_id、字段名与结果，不记录字段值

  - id: UC-003
    title: 冲突冻结与老板裁决
    requirement: REQ-CONFLICT-001
    actors:
      - 员工插件
      - 老板
      - 中枢
    goal: 两个员工对同一业务事实给出不一致写入时冻结该业务事件，报表以总额含冻结加脚注呈现
    entities:
      - ConflictQueue
      - Ledger
      - Decision
      - AuditLog
    api:
      - openConflict
      - resolveConflict
    tests:
      - TC-CONFLICT-001
      - TC-CONFLICT-002
    preconditions: 冻结单元存在（台账/合同/库存批次/客户关系期）
    steps:
      - 中枢登记冲突并把冻结单元冲突标记置为 true
      - 汇总查询返回 total_including_frozen 与 frozen_items
      - 老板在裁决卡选择 A/B/manual/later
      - 裁决后清除冻结标记，写 arbitration_log 与受影响报表清单

  - id: UC-004
    title: 流程注册与准入守卫
    requirement: REQ-WF-001
    actors:
      - 中枢
      - Registry
    goal: 只有通过六项守卫的流程版本才能注册，风险等级由硬规则计算且 meta 不得自述
    entities:
      - WorkflowRegistry
      - EmployeePlugin
      - AuditLog
    api:
      - registerWorkflow
    tests:
      - TC-WF-001
      - TC-WF-002
    preconditions: 流程脚本与 meta 已提交，测试报告哈希已产出
    steps:
      - 提交 workflowId / version / ownerPlugin / meta / code / testReportHash
      - Registry 校验 meta schema、视图授权、幂等完整性、工具合法性、跨员工隔离、代码哈希
      - 守卫通过则按硬规则计算 risk_level 并写入 ref.workflow_registry
      - 守卫失败返回 422 与逐项失败原因，并写审计知会老板

  - id: UC-005
    title: 流程实例与幂等节点
    requirement: REQ-WF-002
    actors:
      - 中枢
      - 员工插件
    goal: 写节点以 instance_id + node_id 幂等键执行，中断恢复不重复入库
    entities:
      - WorkflowInstance
      - WorkflowNodeRun
      - Ledger
    api:
      - startInstance
      - completeNode
    tests:
      - TC-WF-003
      - TC-WF-004
    preconditions: 流程已注册且 required_views 在授权表内
    steps:
      - 以已注册版本启动实例，写生命周期事件
      - 执行写节点前查询幂等记录，已执行则跳过并返回既有结果
      - 未执行则写入并记录幂等键、节点状态与输出
      - 同键不同入参返回 409 并写审计

  - id: UC-006
    title: Verifier 评判与低置信升级
    requirement: REQ-WF-003
    actors:
      - Verifier
      - 老板
      - 中枢
    goal: 高影响节点三次采样投票，置信度低于阈值升级人工，不以低分差自动通过
    entities:
      - VerifierVerdict
      - WorkflowInstance
      - AuditLog
    api:
      - recordVerdict
    tests:
      - TC-WF-005
    preconditions: 实例处于运行中且节点属于 key_nodes
    steps:
      - 中枢在节点 checkpoint 提交 evidence
      - Verifier 按 sampling 采样并给出每次 verdict 与最终置信度
      - 置信度低于阈值且节点高影响则标记 escalated 并生成裁决卡
      - 评判结果与 evidence_hash 写审计，evidence_hash 命中只省调用不改结论

  - id: UC-007
    title: 审计写入与哈希链导出
    requirement: REQ-AUDIT-001
    actors:
      - 中枢
      - 审计归档任务
    goal: 审计只经中枢统一写入，导出 JSONL + SHA-256，链头持久化且可校验
    entities:
      - AuditLog
      - AuditChainHead
      - AuditExport
    api:
      - listAudits
      - exportAudits
    tests:
      - TC-AUDIT-001
      - TC-AUDIT-002
    preconditions: 数据库账号对 audit_log 只有 INSERT 权限
    steps:
      - 派工、工具调用、视图访问、令牌、裁决、流程事件统一调用 audit.record
      - 每日 02:00 增量导出 JSONL，计算全文 SHA-256 与 prev_hash
      - 更新 audit_chain_head，导出目录只追加不覆盖
      - 恢复时先校验链头与最后导出文件一致性，不一致拒绝续链

  - id: UC-008
    title: 定时自动化任务的配置与执行
    requirement: REQ-TASK-001
    actors:
      - 老板
      - 调度器
    goal: 按公司运营需要增删改定期任务，任务以 cron + 时区 + 参数配置驱动，执行有幂等与审计
    entities:
      - TaskSchedule
      - TaskRun
      - Notification
      - AuditLog
    api:
      - listTasks
      - upsertTask
      - runTask
    tests:
      - TC-TASK-001
      - TC-TASK-002
      - TC-TASK-003
    preconditions: 调度器已启动，任务类型已注册
    steps:
      - 老板提交任务 cron、时区、enabled 与参数
      - 调度器校验 cron 表达式与任务类型并保存
      - 到点触发时按 scheduled_at 生成幂等键，重复触发跳过
      - 执行结果写 task_run 与审计，异常按重试策略并写告警通知

  - id: UC-009
    title: 每日晨报聚合产出
    requirement: REQ-TASK-002
    actors:
      - 调度器
      - 老板
    goal: 工作日 08:30 聚合当日待办、到期、冲突与预警，写入 daily_report 并可查询
    entities:
      - DailyReport
      - TaskRun
      - Notification
      - TaxCalendar
      - Contract
      - ConflictQueue
    api:
      - getDailyReport
      - runTask
    tests:
      - TC-TASK-004
    preconditions: 财税与法务基础数据已录入
    steps:
      - 08:30 触发 daily_report 任务
      - 汇总税务申报 ≤7 天、合同到期 ≤30 天、待裁决冲突、低置信升级、观察期异常
      - 按紧急度分级：即时项单独推送，聚合项入晨报
      - 写入 stat.daily_report 并通过通知记录投递

  - id: UC-010
    title: 上传/输入归置到九域
    requirement: REQ-WEB-003
    actors:
      - 老板
      - opc_web
    goal: 会话或上传内容经分类、抽取与决策进入归置卡或收件箱，高风险域一律人工确认
    entities:
      - WebIngestItem
      - AuditLog
    api:
      - ingestText
      - listIngestInbox
      - confirmIngest
    tests:
      - TC-WEB-001
    preconditions: opc_web 已装配，归置表可写
    steps:
      - 老板在中间会话上传/粘贴文本
      - opc_web 计算 content_hash 与幂等键，按规则分类并抽取字段
      - 置信度与风险等级决定 auto_draft / confirm / inbox
      - 老板确认或忽略后写审计；高风险域不在确认前写业务表

  - id: UC-011
    title: 会话与记忆授权读取
    requirement: REQ-WEB-002
    actors:
      - 老板
      - opc_web
    goal: 插件仅在老板授权范围内读取会话与记忆，未授权直接拒绝，来源可追溯
    entities:
      - WebSessionGrant
      - WebSessionMessage
      - WebMemoryCard
      - WebMemoryProposal
      - AuditLog
    api:
      - grantSession
      - revokeSession
      - getSessionContext
      - searchMemory
      - proposeMemory
      - confirmMemoryProposal
    tests:
      - TC-WEB-002
    preconditions: 会话消息已存在；老板在场可授权
    steps:
      - 老板授予 session_id + 用途 + 有效期
      - 插件读取最近 20 条；超出范围或已撤回返回 403
      - 记忆检索按 scope 返回来源与置信度；敏感记忆只返回标记
      - 记忆写入先 propose，老板确认后落库

  - id: UC-012
    title: 驾驶舱快照聚合
    requirement: REQ-WEB-004
    actors:
      - 老板
      - opc_web
    goal: 右栏只读聚合财务/项目/客户/库存/流程/任务/雷达指标，带统一 as_of、冻结脚注与陈旧提示
    entities:
      - DashboardSnapshot
      - BriefItem
      - ConflictQueue
      - WorkflowInstance
      - TaskRun
      - AuditLog
    api:
      - getDashboard
    tests:
      - TC-WEB-003
    preconditions: 业务表已有数据或允许空数据
    steps:
      - 右栏请求指定 range 的驾驶舱
      - 聚合服务在 REPEATABLE READ 只读事务内取数
      - 生成快照并写 dashboard_snapshot；返回 as_of、stale、warnings 与冻结脚注
      - 聚合失败保留上次快照并标注陈旧，不填充 0

  - id: UC-013
    title: 插件雷达与关键词雷达
    requirement: REQ-WEB-005
    actors:
      - 老板
      - 调度器
    goal: 定期检索适用 DSH 插件与公司发展关键词，只推荐不自动安装，附来源与风险
    entities:
      - RadarItem
      - TaskSchedule
      - TaskRun
      - AuditLog
    api:
      - listRadar
      - runTask
    tests:
      - TC-WEB-004
    preconditions: 检索源已配置（MCP/适配器）；未配置时任务标注“本次未检索”
    steps:
      - 调度器按 cron 触发 plugin_radar_scan / keyword_radar_scan
      - 候选经硬过滤与评分，合格项写 radar_item
      - 推荐卡附来源、许可证、权限、风险；不提供自动安装入口
      - 检索失败标注“未检索”，不生成虚构条目

  - id: UC-014
    title: 插件栏入口与右栏清单
    requirement: REQ-WEB-001
    actors:
      - 老板
      - opc_web
    goal: 安装后在 DSH 左栏显示“OPC公司管理”，点击打开右栏驾驶舱/九域/简报/任务/设置
    entities:
      - WebIngestItem
      - DashboardSnapshot
    api:
      - getWebManifest
    tests:
      - TC-WEB-005
    preconditions: DSH Web 提供插件栏与右侧面板插槽，或降级为独立页面
    steps:
      - 插件注册左栏入口与角标
      - 右栏按 manifest 渲染五个页签
      - 宿主不支持插槽时明确提示降级，不伪造已嵌入

  - id: UC-015
    title: 软件项目起点与里程碑登记
    requirement: REQ-PRJ-016
    actors:
      - 项目监理
      - 老板
    goal: 为软件项目登记起点、关键节点与研发要素，里程碑延期留因不自动改期
    entities:
      - Project
      - ProjectMilestone
      - WorkLog
      - AuditLog
    api:
      - listProjectMilestones
      - createProjectMilestone
    tests:
      - TC-PRJ-001
    preconditions: 项目已存在且 project_type=software
    steps:
      - 项目监理登记项目起点（章程批准/基线冻结/启动会）与研发要素
      - 新建里程碑，填写目标日期、责任人与准入/退出条件
      - 里程碑延期时记录原因与影响，不自动改写目标日期
      - 写入 project_milestone 并写审计

  - id: UC-016
    title: Git/SVN 版本库登记
    requirement: REQ-PRJ-017
    actors:
      - 项目监理
      - 老板
    goal: 登记版本库地址与认证引用，只读同步元数据，凭据不落明文
    entities:
      - CodeRepository
      - Project
      - AuditLog
    api:
      - listCodeRepositories
      - registerCodeRepository
    tests:
      - TC-PRJ-002
    preconditions: 项目已存在
    steps:
      - 提交仓库名称、类型（git/svn）、地址与默认分支/主干
      - auth_ref 只接受 env:/secret:/vault:/ssh-agent: 引用，明文拒绝
      - 登记成功写审计；同步状态初始为 pending
      - 同步失败标注 failed，不编造提交记录

  - id: UC-017
    title: Maven/Docker 制品库登记
    requirement: REQ-PRJ-018
    actors:
      - 项目监理
      - 老板
    goal: 登记制品库与命名空间，制品以 digest/校验和为不可变标识
    entities:
      - ArtifactRepository
      - ReleaseOrder
      - AuditLog
    api:
      - listArtifactRepositories
      - registerArtifactRepository
    tests:
      - TC-PRJ-003
    preconditions: 项目已存在
    steps:
      - 提交仓库类型（maven/docker）、地址与命名空间
      - auth_ref 校验同版本库，明文凭据拒绝
      - 登记成功写审计；保留策略仅作建议，不自动删除
      - 发布单引用制品时要求 digest 或校验和，缺失标记证据不完整

  - id: UC-018
    title: SSH 环境登记与发布审批
    requirement: REQ-PRJ-019
    actors:
      - 项目监理
      - 老板
    goal: 登记开发/测试/预发/生产环境，生产发布必须人工审批且带回滚版本
    entities:
      - DeployEnvironment
      - ReleaseOrder
      - AuditLog
    api:
      - listDeployEnvironments
      - registerDeployEnvironment
      - listReleaseOrders
      - createReleaseOrder
      - approveReleaseOrder
    tests:
      - TC-PRJ-004
    preconditions: 项目已存在；SSH 主机指纹已人工确认
    steps:
      - 登记环境，生产环境强制 approval_policy=manual
      - 创建发布单；生产环境缺少 rollback_version 直接拒绝
      - 自动策略仅用于 dev/test，审批人记为 policy:auto
      - pending 发布单经老板审批后转 approved；非 pending 返回 409
      - 环境、发布、审批与失败原因全部写审计

  - id: UC-019
    title: 测试计划与执行记录
    requirement: REQ-PRJ-020
    actors:
      - 项目监理
      - 测试 Agent
      - 老板
    goal: 按项目/版本统一记录测试计划、执行批次与逐用例结果，未执行不计通过
    entities:
      - TestPlan
      - TestCase
      - TestSuite
      - TestRun
      - TestResult
      - Defect
      - AuditLog
    api:
      - createTestPlan
      - createTestRun
      - recordTestResult
      - listDefects
    tests:
      - TC-PRJ-005
    preconditions: 项目已存在；测试环境可用
    steps:
      - 创建测试计划，登记范围、测试类型与进入/退出标准
      - 创建执行批次（human/agent/ci），记录版本与环境
      - 逐用例写入结果；blocked/skipped 不计为通过
      - 失败结果把批次置为 failed，并写审计

  - id: UC-020
    title: 测试 Agent 回归与报告
    requirement: REQ-PRJ-021
    actors:
      - 测试 Agent
      - 老板
      - 项目监理
    goal: 测试 Agent 在 dev/test 生成并执行测试，归类失败并出报告，不自动放行
    entities:
      - TestPlan
      - TestRun
      - TestResult
      - Defect
      - AuditLog
    api:
      - createTestRun
      - recordTestResult
      - listDefects
    tests:
      - TC-PRJ-006
    preconditions: 测试 Agent 已部署为角色卡；目标环境为 dev/test
    steps:
      - 测试 Agent 按需求/验收标准生成用例，无来源的标建议用例
      - 在 dev/test 执行自动化测试并写入批次与结果
      - 失败归类为产品缺陷/用例/环境/数据问题，低置信升级人工
      - 输出含 as_of 的报告；发布/验收结论由老板确认

  - id: UC-021
    title: 时间管理与关键节点提醒
    requirement: REQ-PRJ-022
    actors:
      - 项目监理
      - 老板
    goal: 以项目起点为锚计算工期与关键路径，到期分级提醒且不改期
    entities:
      - Project
      - ProjectMilestone
      - WorkLog
      - AuditLog
    api:
      - listProjectMilestones
      - createProjectMilestone
    tests:
      - TC-PRJ-007
    preconditions: 项目起点与工作日历已登记
    steps:
      - 按项目时区与工作日历计算任务日期与浮动时间
      - 关键节点到期前 7/3/1 天分级提醒
      - 日期变更写审计并列出受影响任务、里程碑与发布单
      - 工时写入 work_log，仅作事实记录

  - id: UC-022
    title: 公司基础资源登记与默认口径
    requirement: REQ-PRJ-023
    actors:
      - 老板
      - 项目监理
    goal: 把公司公用的版本库、制品库、测试服务器、NAS、公网服务器、域名登记成共享目录，默认口径可查可改
    entities:
      - SharedResource
      - SharedSetting
      - AuditLog
    api:
      - listSharedResources
      - createSharedResource
      - updateSharedResource
      - deleteSharedResource
      - getSharedResourceDefaults
    tests:
      - TC-RES-001
      - TC-RES-004
      - TC-RES-005
    preconditions: 迁移 0008 已应用，公司默认口径与已确认资源已播种
    steps:
      - 老板在管理面登记资源（类型、地址、远程管理方式、默认账号、凭据引用）
      - 校验类型枚举与远程管理方式枚举；凭据只接受 env:/secret:/vault:/ssh-agent: 引用
      - 公司默认口径（系统 debian、远程 ssh、默认账号 canetwork、凭据引用）写入 ref.shared_setting
      - 登记与变更全部写审计；被项目绑定的资源禁止删除

  - id: UC-023
    title: 新建项目按公司默认资源选型
    requirement: REQ-PRJ-025
    actors:
      - 老板
      - 项目监理
    goal: 新建项目时默认从公司基础资源中选型绑定，避免每项目重复填地址与凭据
    entities:
      - Project
      - SharedResource
      - ProjectSharedResource
      - AuditLog
    api:
      - createAdminProject
      - listProjectSharedResources
      - bindProjectSharedResources
      - unbindProjectSharedResource
    tests:
      - TC-RES-002
      - TC-RES-003
    preconditions: 公司基础资源已登记，至少一个资源 is_default=true 且 active
    steps:
      - 老板新建项目（只填名称与阶段）
      - 中枢按 is_default + active 选出默认资源并写入 ref.project_shared_resource（applied_by_default=true）
      - 传入 resourceIds 时按显式集合绑定（applied_by_default=false）；bindDefaults=false 时不绑定
      - 项目详情可查已绑定资源与来源标记；解绑与绑定均写审计

  - id: UC-024
    title: 建项目填写版本库并自动检出入档
    requirement: REQ-PRJ-027
    actors:
      - 老板
      - 项目监理
    goal: 新建项目时填写版本库，系统浅克隆后静态扫描，回填项目档案
    entities:
      - Project
      - CodeRepository
      - ProjectCheckout
      - ProjectScan
      - AuditLog
    api:
      - createAdminProject
      - bootstrapProjectAutopilot
      - getProjectAutopilot
    tests:
      - TC-AUTO-001
    preconditions: 版本库地址可达（https/ssh/file/本地路径），Node 环境可用 git
    steps:
      - 老板新建项目并填写版本库地址（可选分支与 env: 凭据引用）
      - 中枢登记 ref.code_repository，浅克隆到工作区并记录 commit/文件数/字节数
      - 静态扫描语言、清单、测试、CI 与目录结构（不执行仓库代码）
      - 回填 biz.project 的 project_type/tech_stack/software_profile
      - 检出失败记录 status=failed 并返回 ERR-AUTO-002，不伪造档案

  - id: UC-025
    title: 自动生成开发/测试/部署计划并推送裁决
    requirement: REQ-PRJ-029
    actors:
      - 老板
      - 项目监理
    goal: 依据扫描结果生成三份计划与测试基线，仅把需老板拍板的事项推入裁决队列
    entities:
      - Project
      - ProjectPlan
      - ProjectDecision
      - ProjectMilestone
      - TestPlan
      - TestCase
      - DeployEnvironment
      - AuditLog
    api:
      - getProjectAutopilot
      - listProjectPlans
      - listProjectDecisions
      - decideProjectDecision
    tests:
      - TC-AUTO-002
      - TC-AUTO-003
      - TC-AUTO-004
    preconditions: 项目已完成自动驾驶检出与扫描
    steps:
      - 按代码规模估算工期并写入 5 个里程碑（开发计划）
      - 生成测试计划 draft 与 3 条基线用例（构建/测试/部署验证）
      - 部署计划复用公司默认测试服务器登记测试环境，生产目标标 waiting-for-decision
      - 无 LICENSE / 无 CI / 无公网服务器 / 技术栈歧义 → 写入裁决队列 pending
      - 老板裁决后置 decided 并写审计，其余事项不打扰老板

  - id: UC-026
    title: 自动化生产（代码骨架、测试流水线、测试环境发布）
    requirement: REQ-PRJ-031
    actors:
      - 老板
      - 项目监理
    goal: 在检出工作区自动补骨架、跑既有测试流水线并发布测试环境；只在需要拍板时转裁决
    entities:
      - Project
      - ProjectScaffold
      - ProjectPipelineRun
      - ProjectDeployRun
      - ReleaseOrder
      - ProjectDecision
      - AuditLog
    api:
      - bootstrapProjectAutopilot
      - deployProjectTest
      - decideProjectDecision
    tests:
      - TC-AUTO-005
      - TC-AUTO-006
      - TC-AUTO-007
    preconditions: 项目已完成检出与扫描，仓库有可识别的构建/测试脚本（或可自动补骨架）
    steps:
      - 仅对缺失文件补 src/test/.gitignore/Dockerfile 等骨架，提交到本地分支（不推送远端）
      - 识别 lint/build/test 脚本并逐个执行（300s 超时、最小环境、安装默认跳过，可显式开启且 --ignore-scripts）
      - 发布测试环境：建发布单 → 有 OPC_TEST_DEPLOY_CMD 则执行并健康检查 → 无配置则 pending 转裁决
      - 骨架合并、流水线失败、发布失败均进入裁决队列，等待老板拍板

  - id: UC-027
    title: 用量遥测与使用习惯审视
    requirement: REQ-OPS-002
    actors:
      - 老板
      - 中枢
    goal: 只记录动作与状态，聚合出高频失败、慢操作与未使用页签，产出体验/需求/流程建议
    entities:
      - UsageEvent
      - IssueFiling
      - AuditLog
    api:
      - getUsageSummary
      - generateUsageInsight
    tests:
      - TC-OPS-001
      - TC-OPS-004
    preconditions: 迁移 0011 已应用；可选配置 AI（OPC_AI_API_KEY / DEEPSEEK_API_KEY）
    steps:
      - HTTP 层自动记录动作、状态码、耗时与错误码（不记请求体与业务内容）
      - 按天聚合：调用量、错误率、慢操作、页签使用分布
      - 规则审视 + 可选 AI 审视，生成 [体验]/[需求]/[流程] 三类草稿
      - 草稿去重后进入 Issue 队列，等待投递

  - id: UC-028
    title: 运行错误自动开 GitHub Issue
    requirement: REQ-OPS-001
    actors:
      - 老板
      - 中枢
    goal: 5xx/运行错误自动去重登记并开 Issue，未配置凭据时只攒草稿
    entities:
      - RuntimeError
      - IssueFiling
      - AuditLog
    api:
      - listIssues
      - syncIssues
    tests:
      - TC-OPS-002
      - TC-OPS-003
      - TC-OPS-005
    preconditions: 可选配置 OPC_GITHUB_TOKEN / OPC_GITHUB_REPO / OPC_GITHUB_API_BASE
    steps:
      - API 5xx 走 catch 分支时按指纹去重累加次数（同指纹只留一条）
      - 定时任务把未上报错误转成 Issue 草稿（含接口、错误码、次数、脱敏消息）
      - sync 按单轮 5 条 / 单日 20 条限额投递 GitHub，记录 number/url
      - 未配置 token → 草稿标 skipped 并保留，不影响主流程

  - id: UC-029
    title: 已建项目接入自动驾驶与重复执行幂等
    requirement: REQ-PRJ-034
    actors:
      - 老板
      - 项目监理
    goal: 已有项目也能一键接入自动驾驶；重复执行只追加计划版本，不重复建资源
    entities:
      - Project
      - CodeRepository
      - ProjectPlan
      - ProjectMilestone
      - TestPlan
      - DeployEnvironment
      - ProjectDecision
      - AuditLog
    api:
      - bootstrapProjectAutopilot
      - getProjectAutopilot
    tests:
      - TC-AUTO-008
      - TC-AUTO-009
    preconditions: 项目已存在（可为手工创建、无版本库）；版本库地址可达
    steps:
      - 管理面「自动驾驶」选中已建项目，预填已登记版本库或从档案回填地址
      - 执行 POST /admin/projects/{id}/autopilot：检出 → 扫描 → 回填档案 → 生成计划
      - 重复执行时复用版本库/测试环境，里程碑与测试计划用例去重，裁决同 topic 不再追问
      - 计划按 (project_id, plan_kind) 版本递增，保留历史

  - id: UC-030
    title: 创意（文本/文档）转项目并进入自动驾驶
    requirement: REQ-PRJ-035
    actors:
      - 老板
    goal: 输入创意或上传文档，经 AI 解析完善后自动建项目并进入自动驾驶；缺仓库时转裁决
    entities:
      - Project
      - ProjectIdea
      - CodeRepository
      - ProjectDecision
      - AuditLog
    api:
      - analyzeIdea
      - createProjectFromIdea
      - listProjectIdeas
      - bootstrapProjectAutopilot
    tests:
      - TC-IDEA-001
      - TC-IDEA-002
      - TC-IDEA-003
      - TC-IDEA-004
      - TC-IDEA-005
    preconditions: 迁移 0012 已应用；可选配置 AI（OPC_AI_API_KEY / DEEPSEEK_API_KEY）
    steps:
      - 老板输入创意文本或上传文档（txt/md/docx/xlsx/pdf，可多选，单文件 ≤10MB、总量 ≤20MB）
      - 文档抽取为纯文本后与文本创意合并
      - AI 解析出项目名、类型、范围、目标、技术栈提示、风险、待确认问题与工期；AI 不可用时规则兜底
      - 自动建项目并绑定公司默认基础资源；有仓库则执行自动驾驶（检出/扫描/计划），无仓库则生成 repository 裁决
      - 解析原文与结果写入 stat.project_idea；无 AI 或解析失败降级不阻塞建项目

  - id: UC-031
    title: 裁决与简报推送到微信，老板在微信里查用
    requirement: REQ-OPS-004
    actors:
      - 老板
      - 中枢
    goal: 待裁决事项与每日简报自动推到微信；未绑定只排队；老板在微信里可直接查用全部 OPC 能力
    entities:
      - WechatPush
      - ProjectDecision
      - AuditLog
    api:
      - getWechatStatus
      - listWechatOutbox
      - pushWechatText
      - syncWechatOutbox
    tests:
      - TC-WECHAT-001
      - TC-WECHAT-002
      - TC-WECHAT-003
      - TC-WECHAT-004
      - TC-WECHAT-005
    preconditions: dsh-im（BotHarness）已安装；已绑定微信 bot 且配置 OPC_WECHAT_BOT_ID / OPC_WECHAT_TARGET_ID
    steps:
      - 裁决创建与晨报生成时写入 stat.wechat_push 队列（同 dedupeKey 去重）
      - 后台任务每分钟经 /api/dsh-im/delivery/messages 投递到期消息，失败按 2s→300s 退避重试 5 次
      - 未绑定微信时只排队不报错，绑定后自动补发
      - 老板在微信里对话即进入 DSH 会话，可直接调用全部 opc_* 工具（查健康/裁决/任务/项目/创意等）
